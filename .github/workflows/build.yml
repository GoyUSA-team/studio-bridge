name: Build experimental APK and release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'studio-bridge-changes.patch'
      - 'custom-source/**'
      - 'scripts/build-studio-bridge.sh'
      - '.github/workflows/build.yml'
permissions:
  contents: write
concurrency:
  group: studio-bridge-experimental-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build from pinned upstream and reviewed source patch
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/build-studio-bridge.sh
      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StudioBridge-0.2-experimental
          path: dist/*
      - name: Publish experimental release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v0.2.0-experimental
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --prerelease \
              --title 'Studio Bridge 0.2 — Login Bridge Fix (experimental)' \
              --notes-file RELEASE-NOTES.md
          fi
